version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src/D365BCAdminMCP
      - /tests/D365BCAdminMCP.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      test-packages:
        patterns:
          - xunit*
          - coverlet*
          - Microsoft.NET.Test.Sdk
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
