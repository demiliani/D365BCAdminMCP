version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src/D365BCAdminMCP
      - /tests/D365BCAdminMCP.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The server targets .NET 10 (LTS): keep the runtime libraries on 10.x and move them
    # to a new major version together with the target framework.
    ignore:
      - dependency-name: Microsoft.Extensions.*
        update-types:
          - version-update:semver-major
    groups:
      test-packages:
        patterns:
          - xunit*
          - coverlet*
          - Microsoft.NET.Test.Sdk
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
