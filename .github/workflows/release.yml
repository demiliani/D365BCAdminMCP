name: Release

# Pushing a tag such as v1.4.0 builds the native binaries, stages the npm packages
# (a maintainer approves them with 2FA on npmjs.com) and drafts a GitHub release.
# One-time setup on npmjs.com and GitHub is described in README.md, "Releasing".

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  verify:
    name: Verify version and run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag matches package.json and is on main
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          package_version=$(node -p "require('./package.json').version")
          if [ "$version" != "$package_version" ]; then
            echo "::error::Tag $TAG does not match the version in package.json ($package_version)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points to a commit that is not on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build and test
        run: dotnet test src/D365BCAdminMCP.sln --configuration Release

  build:
    name: Build ${{ matrix.rid }}
    needs: verify
    # Each binary is built and smoke-tested on its own OS and CPU (macOS binaries must be signed on macOS).
    # Keep in sync with lib/platforms.js.
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            exe: D365BCAdminMCP
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            exe: D365BCAdminMCP
          - rid: win-x64
            os: windows-latest
            exe: D365BCAdminMCP.exe
          - rid: win-arm64
            os: windows-11-arm
            exe: D365BCAdminMCP.exe
          - rid: osx-x64
            os: macos-15-intel
            exe: D365BCAdminMCP
          - rid: osx-arm64
            os: macos-latest
            exe: D365BCAdminMCP
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Self-contained, single-file and trimmed (see the csproj).
      - name: Publish binary
        run: dotnet publish src/D365BCAdminMCP/D365BCAdminMCP.csproj -c Release -r ${{ matrix.rid }} -o build/${{ matrix.rid }}

      - name: Smoke test (MCP initialize + tools/list)
        run: node scripts/smoke-test.js build/${{ matrix.rid }}/${{ matrix.exe }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.rid }}
          path: build/${{ matrix.rid }}/${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 7

  pack:
    name: Pack npm packages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: binaries

      - name: Pack one package per platform plus the main package
        run: |
          for dir in binaries/binary-*; do mv "$dir" "binaries/${dir#binaries/binary-}"; done
          node scripts/pack-npm.js binaries npm-packages

      - name: Install the packages like a user and smoke test
        run: |
          version=$(node -p "require('./package.json').version")
          npm install -g --prefix "$RUNNER_TEMP/user" "./npm-packages/demiliani-d365bc-admin-mcp-linux-x64-$version.tgz" "./npm-packages/demiliani-d365bc-admin-mcp-$version.tgz"
          "$RUNNER_TEMP/user/bin/d365bc-admin-mcp" --version
          node scripts/smoke-test.js "$RUNNER_TEMP/user/bin/d365bc-admin-mcp"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: npm-packages/
          if-no-files-found: error
          retention-days: 30

  publish-npm:
    name: Stage npm packages
    needs: [verify, pack]
    runs-on: ubuntu-latest
    # Must match the environment configured on the npm trusted publishers.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm stage publish needs npm 11.15 or later.
      - name: Install npm
        run: npm install -g npm@12.2.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: npm-packages

      - name: Stage the packages on npm (trusted publishing, no token)
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then node scripts/publish-npm.js npm-packages --tag next; else node scripts/publish-npm.js npm-packages; fi
          echo "::notice::Staged version $VERSION. Approve the platform packages first and @demiliani/d365bc-admin-mcp last, with 2FA on npmjs.com (Staged Packages)."

  github-release:
    name: Draft GitHub release
    needs: [verify, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: artifacts

      - name: Package binaries
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir dist
          for dir in artifacts/binary-*; do
            rid="${dir#artifacts/binary-}"
            if [[ "$rid" == win-* ]]; then
              (cd "$dir" && zip -q "../../dist/d365bc-admin-mcp-$VERSION-$rid.zip" D365BCAdminMCP.exe)
            else
              chmod +x "$dir/D365BCAdminMCP"
              tar -czf "dist/d365bc-admin-mcp-$VERSION-$rid.tar.gz" -C "$dir" D365BCAdminMCP
            fi
          done
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=(--draft --verify-tag --generate-notes --title "$TAG")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
