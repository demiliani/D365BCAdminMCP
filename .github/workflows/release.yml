name: Release

# Pushing a tag such as v1.4.0 builds the native binaries, stages the npm package
# (a maintainer approves it with 2FA on npmjs.com) and drafts a GitHub release.
# One-time setup on npmjs.com and GitHub is described in README.md, "Releasing".

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  verify:
    name: Verify version and run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag matches package.json and the csproj and is on main
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          package_version=$(node -p "require('./package.json').version")
          csproj_version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/D365BCAdminMCP/D365BCAdminMCP.csproj)
          if [ "$version" != "$package_version" ] || [ "$version" != "$csproj_version" ]; then
            echo "::error::Tag $TAG does not match package.json ($package_version) and D365BCAdminMCP.csproj ($csproj_version)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points to a commit that is not on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build and test
        run: dotnet test src/D365BCAdminMCP.sln --configuration Release

  build:
    name: Build ${{ matrix.rid }}
    needs: verify
    # Each binary is built and smoke-tested on its own OS (macOS binaries must be signed on macOS).
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            exe: D365BCAdminMCP
          - rid: win-x64
            os: windows-latest
            exe: D365BCAdminMCP.exe
          - rid: osx-arm64
            os: macos-latest
            exe: D365BCAdminMCP
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Publish self-contained single-file binary
        run: dotnet publish src/D365BCAdminMCP/D365BCAdminMCP.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o build/${{ matrix.rid }}

      - name: Smoke test (MCP initialize + tools/list)
        run: node scripts/smoke-test.js build/${{ matrix.rid }}/${{ matrix.exe }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.rid }}
          path: build/${{ matrix.rid }}/${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    name: Stage npm package
    needs: [verify, build]
    runs-on: ubuntu-latest
    # Must match the environment configured on the npm trusted publisher.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm stage publish needs npm 11.15 or later.
      - name: Install npm
        run: npm install -g npm@12.2.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-linux-x64
          path: build/linux-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-win-x64
          path: build/win-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-osx-arm64
          path: build/osx-arm64

      # Artifacts do not keep the executable bit.
      - name: Restore executable permissions
        run: chmod +x build/linux-x64/D365BCAdminMCP build/osx-arm64/D365BCAdminMCP

      - name: Smoke test through the npm launcher
        run: npm test

      - name: Check package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map((f) => f.path);
            const required = ["bin/d365bc-admin-mcp.js", "build/linux-x64/D365BCAdminMCP", "build/win-x64/D365BCAdminMCP.exe", "build/osx-arm64/D365BCAdminMCP"];
            const missing = required.filter((f) => !files.includes(f));
            console.log(files.join("\n"));
            if (missing.length) { console.error("Missing from package: " + missing.join(", ")); process.exit(1); }
          '
          rm pack.json

      - name: Stage the package on npm (trusted publishing, no token)
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then npm stage publish --tag next; else npm stage publish; fi
          echo "::notice::Staged @demiliani/d365bc-admin-mcp@${{ needs.verify.outputs.version }}. Approve it with 2FA on npmjs.com (package > Staged Packages) to publish it."

  github-release:
    name: Draft GitHub release
    needs: [verify, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: artifacts

      - name: Package binaries
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir dist
          chmod +x artifacts/binary-linux-x64/D365BCAdminMCP artifacts/binary-osx-arm64/D365BCAdminMCP
          tar -czf "dist/d365bc-admin-mcp-$VERSION-linux-x64.tar.gz" -C artifacts/binary-linux-x64 D365BCAdminMCP
          tar -czf "dist/d365bc-admin-mcp-$VERSION-osx-arm64.tar.gz" -C artifacts/binary-osx-arm64 D365BCAdminMCP
          (cd artifacts/binary-win-x64 && zip -q "../../dist/d365bc-admin-mcp-$VERSION-win-x64.zip" D365BCAdminMCP.exe)
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=(--draft --verify-tag --generate-notes --title "$TAG")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
